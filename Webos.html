<script>
const $=s=>document.querySelector(s),desk=$('#desk'),tasks=$('#tasks'),menu=$('#menu');
let zTop=10,focused=null;
const open={};
const APPS={
 office:{name:'Office Suite',icon:'▦',w:1120,h:760,start:startOfficeHub},
 calc:{name:'Calculator',icon:'🧮',w:400,h:330,start:startCalc},
 term:{name:'Terminal',icon:'🖥️',w:700,h:460,start:startTerm},
 files:{name:'Files',icon:'🗂️',w:760,h:520,start:startFiles},
 video:{name:'Video Player',icon:'🎬',w:800,h:520,start:startVideo},
 settings:{name:'Settings',icon:'⚙️',w:500,h:360,start:startSettings},
 gemrunner:{name:'Gem Runner',icon:'💎',w:1100,h:670,start:startGemRunner},
 survival:{name:'Block Survival',icon:'⛏️',w:1180,h:820,start:startSurvival}
};

/* ---------- window manager ---------- */
function loop(rec,fn){const f=()=>{if(!rec.alive)return;fn();requestAnimationFrame(f)};f()}
function launch(id){
 if(open[id])return focusWin(open[id]);
 const app=APPS[id],n=Object.keys(open).length,rec={id,keys:{},alive:true};
 const el=document.createElement('div');
 el.className='win';
 const ww=Math.min(app.w,Math.max(360,innerWidth-24)),hh=Math.min(app.h+34,Math.max(260,innerHeight-72));
  Object.assign(el.style,{width:ww+'px',height:hh+'px',left:Math.max(0,Math.min(innerWidth-ww-8,80+n*24))+'px',top:Math.max(0,Math.min(innerHeight-hh-62,28+n*22))+'px'});
 el.innerHTML='<div class="title"><b></b><button class="x" title="Close">✕</button></div><div class="body"></div>';
 el.querySelector('b').textContent=app.name;
 const btn=document.createElement('button');
 btn.className='t';btn.textContent=app.icon+' '+app.name;btn.onclick=()=>focusWin(rec);
 Object.assign(rec,{el,btn});
 desk.appendChild(el);tasks.appendChild(btn);open[id]=rec;
 el.querySelector('.x').onclick=()=>closeWin(rec);
 el.addEventListener('pointerdown',()=>focusWin(rec));
 dragWin(el);
 app.start(el.querySelector('.body'),rec);
 focusWin(rec);
}
function focusWin(rec){
 if(!rec.alive)return;
 if(focused&&focused!==rec)focused.keys={};
 document.activeElement?.blur();
 focused=rec;rec.keys={};rec.el.style.zIndex=++zTop;
 for(const k in open)open[k].btn.classList.toggle('on',open[k]===rec);
}
function closeWin(rec){if(typeof rec.onClose==='function'){try{rec.onClose()}catch(e){}}rec.alive=false;rec.el.remove();rec.btn.remove();delete open[rec.id];if(focused===rec)focused=null}
function dragWin(el){
 el.querySelector('.title').addEventListener('dblclick',()=>{if(el.dataset.max){el.style.left=el.dataset.l;el.style.top=el.dataset.t;el.style.width=el.dataset.w;el.style.height=el.dataset.h;el.dataset.max=''}else{el.dataset.l=el.style.left;el.dataset.t=el.style.top;el.dataset.w=el.style.width;el.dataset.h=el.style.height;el.dataset.max='1';el.style.left='0px';el.style.top='0px';el.style.width='100%';el.style.height='calc(100% - 58px)'}});
el.querySelector('.title').addEventListener('pointerdown',e=>{
  if(e.target.tagName==='BUTTON')return;
  const dx=e.clientX-el.offsetLeft,dy=e.clientY-el.offsetTop;
  const mv=ev=>{el.style.left=Math.max(0,ev.clientX-dx)+'px';el.style.top=Math.max(0,ev.clientY-dy)+'px'};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
 });
}
addEventListener('keydown',e=>{if(!focused)return;const t=e.target;if(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)return;if(/^(Arrow|Space)/.test(e.code))e.preventDefault();focused.keys[e.code]=true});
addEventListener('keyup',e=>{if(focused)focused.keys[e.code]=false});

/* desktop icons, start menu, clock */
Object.entries(APPS).forEach(([id,a],i)=>{
 const d=document.createElement('div');
 d.className='icon';d.style.left=(20+Math.floor(i/4)*110)+'px';d.style.top=(20+(i%4)*104)+'px';
 d.innerHTML='<i>'+a.icon+'</i>'+a.name;
 d.ondblclick=()=>launch(id);
 desk.appendChild(d);
});
menu.innerHTML='<div class="menu-heading"><span>App library</span><small>WEBOS ONE</small></div><input id="appSearch" type="search" placeholder="Search apps…" autocomplete="off"><div id="menuApps"></div><div class="menu-foot">Double-click a desktop icon to launch</div>';
const menuApps=menu.querySelector('#menuApps');
for(const id in APPS){const d=document.createElement('div');d.className='menu-app';d.dataset.name=APPS[id].name.toLowerCase();d.innerHTML='<span class="menu-icon">'+APPS[id].icon+'</span><span>'+APPS[id].name+'</span><span class="menu-arrow">›</span>';d.onclick=()=>{menu.style.display='none';launch(id)};menuApps.appendChild(d)}
menu.querySelector('#appSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();menuApps.querySelectorAll('.menu-app').forEach(d=>d.style.display=d.dataset.name.includes(q)?'flex':'none')});
$('#startBtn').onclick=()=>{menu.style.display=menu.style.display==='block'?'none':'block';if(menu.style.display==='block'){const search=menu.querySelector('#appSearch');search.value='';menuApps.querySelectorAll('.menu-app').forEach(d=>d.style.display='flex');search.focus()}};
addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&e.target.id!=='startBtn')menu.style.display='none'});
function tick(){$('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'  ·  '+new Date().toLocaleDateString([],{month:'short',day:'numeric'})}
tick();setInterval(tick,1000);

let gemRunnerHtmlCache = null;
function getGemRunnerHtml(){
 if(gemRunnerHtmlCache)return gemRunnerHtmlCache;
 const bin=atob(GEM_RUNNER_HTML_B64);
 const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
 gemRunnerHtmlCache=new TextDecoder('utf-8').decode(bytes);
 return gemRunnerHtmlCache;
}
function startGemRunner(body,rec){
 const src=getGemRunnerHtml();
 body.innerHTML=`<div class="game-shell">
   <div class="game-toolbar">
    <div class="game-label"><span class="game-dot"></span><strong>GEM RUNNER</strong><span class="game-help">A/D or arrows move · W/Space jump · F fire · P pause · M mute</span></div>
    <div class="game-actions"><button class="t" data-gem-action="reload" title="Restart Gem Runner">↻</button><button class="t" data-gem-action="new" title="Open game in a new tab">↗</button><button class="t" data-gem-action="full" title="Fullscreen game">⛶</button></div>
   </div>
   <iframe class="game-frame" title="Gem Runner" allow="fullscreen; autoplay; gamepad" tabindex="0" referrerpolicy="no-referrer"></iframe>
  </div>`;
 const frame=body.querySelector('.game-frame');
 const load=()=>{frame.srcdoc=src;};
 load();
 frame.addEventListener('pointerdown',()=>{
  if(!rec.alive)return;
  focused=rec;rec.el.style.zIndex=++zTop;
  for(const k in open)open[k].btn.classList.toggle('on',open[k]===rec);
  frame.focus({preventScroll:true});
 });
 body.querySelector('[data-gem-action="reload"]').onclick=load;
 body.querySelector('[data-gem-action="new"]').onclick=()=>{

function lex(s){

   let j=i;while(j<s.length&&isL(s[j]))j++;
   let k=j;while(k<s.length&&isD(s[k]))k++;
   if(k===j){out.push({t:'id',v:s.slice(i,j)});i=j;continue}
   if(s[k]===':'){
    let f=k+1,h=f;while(h<s.length&&isL(s[h]))h++;
    let m=h;while(m<s.length&&isD(s[m]))m++;
    if(h>f&&m>h){out.push({t:'rng',v:s.slice(i,m)});i=m;continue}
   }
   out.push({t:'ref',v:s.slice(i,k)});i=k;continue;
  }
  if(isD(c)||c==='.'){let j=i;while(j<s.length&&(isD(s[j])||s[j]==='.'))j++;const n=+s.slice(i,j);if(isNaN(n))throw 0;out.push({t:'num',v:n});i=j;continue}
  if('+-*/^(),'.indexOf(c)>=0){out.push({t:'op',v:c});i++;continue}

 const term=()=>{let v=fac();while(isOp('*')||isOp('/')){const o=T[i++].v,r=fac();v=o==='*'?v*r:v/r}return v};
 const fac=()=>{const b=un();if(isOp('^')){i++;return Math.pow(b,fac())}return b};
 const un=()=>{if(isOp('-')){i++;return -un()}if(isOp('+')){i++;return un()}return atom()};
 const args=()=>{const a=[],one=()=>{if(pk()&&pk().t==='rng')a.push(...rng(T[i++].v));else a.push(expr())};if(!isOp(')')){one();while(isOp(',')){i++;one()}}return a};

  if(t.t==='num')return t.v;
  if(t.t==='ref')return ref(t.v.toUpperCase());
  if(t.t==='op'&&t.v==='('){const v=expr();if(!isOp(')'))throw 0;i++;return v}
  if(t.t==='id'&&isOp('(')){i++;const a=args();if(!isOp(')'))throw 0;i++;return fn(t.v.toUpperCase(),a)}
  throw 0};

  if(n==='SUM')return a.reduce((s,x)=>s+x,0);
  if(n==='AVERAGE')return a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
  if(n==='MIN')return a.length?Math.min(...a):0;
  if(n==='MAX')return a.length?Math.max(...a):0;
  if(n==='COUNT')return a.length;
  if(n==='ROUND'){const p=10**(a[1]||0);return Math.round(a[0]*p)/p}
  throw 0};

}

 let prevUrl=null;
 const list=async()=>{
  const all=(await dbDo('readonly',s=>s.getAll()))||[];

  st.textContent=all.length+' file(s) saved in this browser';
  fl.innerHTML=all.map(f=>`<div class='frow'><span>${kindOf(f.type||'')}</span><span class='fn'>${esc(f.name)}</span><span class='fz'>${(f.size/1048576).toFixed(2)} MB</span><button class='t' data-o='${esc(f.name)}'>Open</button><button class='t' data-d='${esc(f.name)}'>Delete</button></div>`).join('')||'<p class=empty>No files yet. Click Import files.</p>';

 fl.onclick=async e=>{
  const o=e.target.dataset.o,d=e.target.dataset.d;

 list();
}
